ALG: SAC
EXP_NAME: sac

PIXEL_BASED: True
NATIVE_DOWNSCALING: True

TOTAL_TIMESTEPS: 1000000
BUFFER_SIZE: 50000
LEARNING_STARTS: 5000
SCAN_STEPS: 1000

NUM_ENVS: 1
BATCH_SIZE: 64
GAMMA: 0.99
TAU: 0.005
ALPHA: 0.2
AUTOTUNE: True

POLICY_LR: 0.0003
Q_LR: 0.0003
ALPHA_LR: 0.0003
ENCODER_LR: 0.0003
POLICY_FREQUENCY: 1
TARGET_NETWORK_FREQUENCY: 1

# Dopamine reward_scale_factor: clipped Atari rewards (±1/0) have a mean of
# ~-0.027 (losing Pong) which is SMALLER than the SAC entropy bonus
# (-alpha*logp ≈ +0.033 with alpha=0.135 at the floor). Without scaling, the
# entropy term dominates and Q collapses to a flat ≈0.2 for every action →
# ∇_a Q ≈ 0 → policy freezes uniform. With scale=10 the scaled reward (-0.27/step)
# still dominates the entropy bonus (+0.24/step) so the gap is broken, but the
# critic target range (±10) stays small enough to fit — scale=100 caused Q
# divergence (target oscillates ±100, |g_q| ~ 8000, Q ~ -108 after ~150k steps).
# DQN/PPO don't need this knob because they have no entropy bonus.
REWARD_SCALE_FACTOR: 10.0

# Keep the replay buffer on CPU to avoid exhausting GPU VRAM.
# Set to False to keep it on GPU (faster but uses much more VRAM).
BUFFER_ON_CPU: True

# Number of transitions to accumulate on GPU before transferring the whole
# batch to CPU and calling buffer.add once.
FILL_BATCH_SIZE: 256

# Accumulating a few transitions on GPU and flushing them together reduces
# the number of expensive buffer.add calls by a factor of TRAIN_ADD_BATCH_SIZE.
TRAIN_ADD_BATCH_SIZE: 32